name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://yaye_academy:yaye_academy@localhost:5432/yaye_academy?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_NAME: Yaye Academy
      DEFAULT_CURRENCY: ETB
      DEFAULT_TIMEZONE: Africa/Addis_Ababa
      BETTER_AUTH_SECRET: yaye-academy-ci-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yaye_academy
          POSTGRES_USER: yaye_academy
          POSTGRES_PASSWORD: yaye_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaye_academy -d yaye_academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed development role accounts
        run: npm run db:seed

      - name: Verify database connection
        run: npm run db:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser test
        run: npm run test:e2e
